# 作用：配置pytest相关的运行参数。

[pytest]
log_file=logs/test.log
log_file_level=INFO
log_file_format=%(asctime)s %(levelname)s %(message)s
log_file_date_format=%Y-%m-%d %H:%M:%S

addopts = -p no:faulthandler

markers=
    search_kw: 搜索关键字(demoProject的marker)
    api: API接口测试
    unit: 框架公共能力单元测试
    failure_demo: 故意失败的报告展示用例，仍会被pytest正常收集
